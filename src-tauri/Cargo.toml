[package]
# TODO: rename to your app (also update [lib] name + tauri.conf.json productName/identifier)
name = "w3mm"
version = "26.10.0"
description = "Witcher 3 Legacy Mod Nexus manager for Linux (Proton/Wine)"
authors = ["W3MM Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "w3mm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
sevenz-rust = "0.6"
tar = "0.4"
flate2 = "1"
regex = "1"
walkdir = "2"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
encoding_rs = "0.8"
quick-xml = "0.36"
thiserror = "1"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
crc32fast = "1"
unrar = "0.5"
trash = "3"
# --- UPDATER (optional) ---
# To enable in-app updates later:
#   1. Uncomment the next line.
#   2. Uncomment the updater plugin in src/main.rs (marked UPDATER).
#   3. Add "updater:default" to src-tauri/capabilities/default.json permissions.
#   4. Add the plugins.updater section to src-tauri/tauri.conf.json (see README).
#   5. Uncomment the updater steps in .github/workflows/release.yml (marked UPDATER).
#   6. Add a TAURI_SIGNING_PRIVATE_KEY repo secret (see README).
# tauri-plugin-updater = "2"

[profile.dev]
incremental = true

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"
